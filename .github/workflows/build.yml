name: Build

on:
  push:
    branches: [ master, fix-skylanders-loading ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-14

    env:
      XCODE_COMMON_BUILD_ARGS: -project Source/iOS/App/DolphiniOS.xcodeproj -derivedDataPath "${{ github.workspace }}/build-Xcode" -sdk iphoneos -destination generic/platform=iOS DOL_PBID_ORGANIZATION_IDENTIFIER="me.oatmealdome" DOL_BUILD_SOURCE="development" CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Build Utilities
        run: |
          brew install cmake ninja

      - name: Set Schema
        run: |
          echo "XCODE_CONFIGURATION_NJB=Release (Non-Jailbroken)" >> $GITHUB_ENV

      - name: Build Application
        run: |
          rm -rf "${{ github.workspace }}/archives" || true
          mkdir "${{ github.workspace }}/archives"
          xcodebuild archive -archivePath "${{ github.workspace }}/archives/NonJailbroken.xcarchive" -configuration "${{ env.XCODE_CONFIGURATION_NJB }}" -scheme "DiOS (NJB)" ${{ env.XCODE_COMMON_BUILD_ARGS }}

      - name: Build IPA File
        run: |
          mkdir "${{ github.workspace }}/products"
          APP_PATH="${{ github.workspace }}/archives/NonJailbroken.xcarchive/Products/Applications/DolphiniOS.app"
          PAYLOAD_DIR=$(mktemp -d)
          mkdir "$PAYLOAD_DIR/Payload"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/Payload/"
          # Ad-hoc sign (LiveContainer/SideStore will re-sign with a real identity)
          codesign -f -s - "$PAYLOAD_DIR/Payload/DolphiniOS.app/Frameworks/"* || true
          codesign -f -s - --entitlements "${{ github.workspace }}/Source/iOS/App/Project/Entitlements/Public.entitlements" "$PAYLOAD_DIR/Payload/DolphiniOS.app"
          cd "$PAYLOAD_DIR"
          zip -r "${{ github.workspace }}/products/DolphiniOS-NJB.ipa" .

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DolphiniOS-NJB
          path: products/DolphiniOS-NJB.ipa
